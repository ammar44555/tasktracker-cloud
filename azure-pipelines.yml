trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'tasktracker'
  # Aapka ACR name 'rigistry' hai
  acrName: 'rigistry' 

stages:
- stage: Build
  displayName: 'Build and Push Stage'
  jobs:
  - job: BuildPush
    steps:
    - task: Docker@2
      displayName: 'Build and Push to ACR'
      inputs:
        containerRegistry: 'acr-connection'
        repository: $(imageName)
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest

- stage: DeployAppService
  displayName: 'Deploy to Web App'
  dependsOn: Build
  jobs:
  - deployment: WebDeploy
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy Container to Azure'
            inputs:
              # Connection name must be exact: azure-connection
              azureSubscription: 'azure-connection' 
              appName: 'tasktracker-web'
              imageName: '$(acrName).azurecr.io/$(imageName):$(Build.BuildId)'
