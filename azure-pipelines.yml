trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'tasktracker'
  acrName: 'rigistry' 
  # Aapka select kiya hua namespace
  k8sNamespace: 'tasktracker' 

stages:
- stage: Build
  displayName: 'Build and Push Stage'
  jobs:
  - job: BuildPush
    steps:
    - task: Docker@2
      displayName: 'Build and Push to ACR'
      inputs:
        containerRegistry: 'acr-connection'
        repository: $(imageName)
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest

- stage: DeployToAKS
  displayName: 'Deploy to Kubernetes'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: AKSDeploy
    # Is se Approval Gate trigger hoga
    environment: 'production' 
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@0
            displayName: 'Deploy to AKS'
            inputs:
              action: 'deploy'
              # Azure DevOps mein banaya gaya connection
              kubernetesServiceConnection: 'tasktracker-aks-conn' 
              namespace: $(k8sNamespace)
              manifests: |
                $(System.DefaultWorkingDirectory)/deployment.yaml
              containers: |
                $(acrName).azurecr.io/$(imageName):$(Build.BuildId)
