trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'tasktracker'
  # Yahan apna ACR name theek karein (e.g., rigistry)
  acrName: 'rigistry' 

stages:
- stage: Build
  displayName: Build and Push Stage
  jobs:
  - job: BuildPush
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: 'acr-connection'
        repository: $(imageName)
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest

- stage: DeployAppService
  dependsOn: Build
  jobs:
  - deployment: WebDeploy
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            inputs:
              # Yahan apni Service Connection ka naam likhein (e.g., azure-conn)
              azureSubscription: 'azure-conn'
              # Apna Web App name sahi likhein
              appName: 'tasktracker-web'
              imageName: '$(acrName).azurecr.io/$(imageName):$(Build.BuildId)'
