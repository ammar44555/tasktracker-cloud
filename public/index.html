<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskTracker Cloud</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-animation" id="bgAnim"></div>

  <div class="container">
    <h1>TaskTracker Cloud</h1>
    <p>Running on Azure</p>

    <div class="section">
      <h2>📝 Tasks</h2>
      <div class="form-row">
        <input type="text" id="taskInput" placeholder="New task">
        <button onclick="addTask()">Add</button>
      </div>
      <ul id="taskList"></ul>
    </div>

    <div class="section">
      <h2>📁 Files (Azure Blob Storage)</h2>
      <div class="form-row">
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">Upload</button>
      </div>
      <p id="uploadStatus"></p>
      <ul id="fileList"></ul>
    </div>
  </div>

  <script>
    // ====== Background Animation ======
    const bgAnim = document.getElementById('bgAnim');
    const symbols = ['^', '>', '<', 'v', '{', '}']; 

    function createSymbol() {
        const el = document.createElement('div');
        el.className = 'carat';
        el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = Math.random() * 100 + "vw";
        const duration = Math.random() * 5 + 7; 
        el.style.animationDuration = duration + "s";
        el.style.fontSize = (Math.random() * 15 + 15) + "px";
        bgAnim.appendChild(el);
        setTimeout(() => { el.remove(); }, duration * 1000);
    }
    setInterval(createSymbol, 400);

    // ====== Tasks Logic ======
    async function loadTasks() {
      try {
        const res = await fetch('/api/tasks');
        const tasks = await res.json();
        document.getElementById('taskList').innerHTML = 
          tasks.map(t => `<li>${t.title}</li>`).join('');
      } catch (err) { console.error("Tasks load failed", err); }
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      if (!input.value) return;
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      loadTasks();
    }

    // ====== Files Logic ======
    async function loadFiles() {
      try {
        const res = await fetch('/api/files');
        const files = await res.json();
        document.getElementById('fileList').innerHTML = files.map(f => `
          <li>
            <strong>${f.name}</strong>
            (${(f.size / 1024).toFixed(2)} KB)
            <a href="/api/files/${encodeURIComponent(f.name)}">Download</a>
            <button onclick="deleteFile('${f.name}')" style="margin-left:10px; background:#ff4d4d; padding:4px 8px;">Delete</button>
          </li>
        `).join('');
      } catch (err) { console.error("Files load failed", err); }
    }

    async function uploadFile() {
      const input = document.getElementById('fileInput');
      const status = document.getElementById('uploadStatus');
      if (!input.files[0]) {
        status.textContent = 'Please select a file';
        return;
      }
      const formData = new FormData();
      formData.append('file', input.files[0]);
      status.textContent = 'Uploading...';
      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          status.textContent = '✅ Uploaded: ' + data.name;
          input.value = '';
          loadFiles();
        } else {
          status.textContent = '❌ Error: ' + data.error;
        }
      } catch (err) {
        status.textContent = '❌ Upload failed: ' + err.message;
      }
    }

    async function deleteFile(name) {
      if (!confirm('Delete ' + name + '?')) return;
      await fetch('/api/files/' + encodeURIComponent(name), { method: 'DELETE' });
      loadFiles();
    }

    // Initial Load
    loadTasks();
    loadFiles();
  </script>
</body>
</html>
