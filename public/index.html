<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TaskTracker Cloud</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>TaskTracker Cloud</h1>
    <p>Running on Azure</p>

    <!-- Tasks Section -->
    <div class="section">
      <h2>📝 Tasks</h2>
      <div class="form-row">
        <input type="text" id="taskInput" placeholder="New task">
        <button onclick="addTask()">Add</button>
      </div>
      <ul id="taskList"></ul>
    </div>

    <!-- Files Section (NEW) -->
    <div class="section">
      <h2>📁 Files (Azure Blob Storage)</h2>
      <div class="form-row">
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">Upload</button>
      </div>
      <p id="uploadStatus"></p>
      <ul id="fileList"></ul>
    </div>
  </div>

  <script>
    // ====== Tasks ======
    async function loadTasks() {
      const res = await fetch('/api/tasks');
      const tasks = await res.json();
      document.getElementById('taskList').innerHTML = 
        tasks.map(t => `<li>${t.title}</li>`).join('');
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      if (!input.value) return;
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      loadTasks();
    }

    // ====== Files (NEW) ======
    async function loadFiles() {
      const res = await fetch('/api/files');
      const files = await res.json();
      document.getElementById('fileList').innerHTML = files.map(f => `
        <li>
          <strong>${f.name}</strong>
          (${(f.size / 1024).toFixed(2)} KB)
          <a href="/api/files/${encodeURIComponent(f.name)}">Download</a>
          <button onclick="deleteFile('${f.name}')">Delete</button>
        </li>
      `).join('');
    }

    async function uploadFile() {
      const input = document.getElementById('fileInput');
      const status = document.getElementById('uploadStatus');
      
      if (!input.files[0]) {
        status.textContent = 'Please select a file';
        return;
      }

      const formData = new FormData();
      formData.append('file', input.files[0]);

      status.textContent = 'Uploading...';
      
      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        if (data.success) {
          status.textContent = '✅ Uploaded: ' + data.name;
          input.value = '';
          loadFiles();
        } else {
          status.textContent = '❌ Error: ' + data.error;
        }
      } catch (err) {
        status.textContent = '❌ Upload failed: ' + err.message;
      }
    }

    async function deleteFile(name) {
      if (!confirm('Delete ' + name + '?')) return;
      await fetch('/api/files/' + encodeURIComponent(name), { method: 'DELETE' });
      loadFiles();
    }

    // Load on page open
    loadTasks();
    loadFiles();
  </script>
</body>
</html>
